<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14160f;
    --surface:#1c1f16;
    --surface-raised:#22261a;
    --border:#33372a;
    --text:#eeead9;
    --muted:#a3a58e;
    --faint:#5f624f;
    --accent:#d9a441;
    --accent-soft:#3a3220;
    --today:#8bab6f;
    --today-soft:#232c1c;
    --radius:12px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    padding:2.5rem 1.25rem 4rem;
    display:flex;
    justify-content:center;
  }

  main{
    width:100%;
    max-width:620px;
  }

  header{
    padding-bottom:1.25rem;
    border-bottom:1px solid var(--border);
    margin-bottom:1.75rem;
  }

  .eyebrow{
    font-size:0.75rem;
    color:var(--faint);
    margin:0 0 0.35rem;
    letter-spacing:0.02em;
  }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:1.85rem;
    margin:0 0 0.35rem;
    line-height:1.2;
  }

  .subhead{
    font-size:0.88rem;
    color:var(--muted);
  }

  .week{
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }

  .day-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid transparent;
    border-radius:var(--radius);
    padding:0.9rem 1.1rem;
    display:flex;
    gap:1rem;
    align-items:flex-start;
  }

  .day-card.is-today{
    border-left-color:var(--today);
    background:var(--today-soft);
  }

  .day-card.is-free{
    opacity:0.6;
  }

  .day-label{
    flex:none;
    width:92px;
    padding-top:0.15rem;
  }

  .day-name{
    font-weight:600;
    font-size:0.92rem;
  }

  .today-tag{
    display:inline-block;
    margin-top:0.25rem;
    font-size:0.65rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--today);
    background:rgba(139,171,111,0.12);
    border:1px solid rgba(139,171,111,0.35);
    border-radius:999px;
    padding:0.12rem 0.5rem;
  }

  .day-classes{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:0.5rem;
  }

  .class-pill{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.75rem;
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:8px;
    padding:0.5rem 0.75rem;
  }

  .class-pill .subject{
    font-weight:500;
    font-size:0.9rem;
  }

  .class-pill .subject::before{
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    margin-right:0.5rem;
  }

  .class-pill .time{
    font-size:0.8rem;
    color:var(--muted);
    white-space:nowrap;
  }

  .no-class{
    font-size:0.85rem;
    color:var(--faint);
    font-style:italic;
    padding:0.35rem 0;
  }

  footer{
    text-align:center;
    font-size:0.75rem;
    color:var(--faint);
    margin-top:2rem;
  }

  .state-msg{
    color:var(--muted);
    font-size:0.9rem;
    padding:2rem 0;
    text-align:center;
  }

  @media (max-width:420px){
    .day-card{
      flex-direction:column;
      gap:0.6rem;
    }
    .day-label{
      width:auto;
      display:flex;
      align-items:center;
      gap:0.6rem;
    }
    .today-tag{
      margin-top:0;
    }
  }
</style>
</head>
<body>
<main>

  <header>
    <p class="eyebrow">Weekly routine</p>
    <h1 id="page-title">&nbsp;</h1>
    <p class="subhead" id="today-line"></p>
  </header>

  <div class="week" id="week-list">
    <p class="state-msg">Loading routine…</p>
  </div>

  <footer>View only &middot; updated automatically</footer>

</main>

<script>
  const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function render(data){
    document.getElementById('page-title').textContent = data.title || 'Weekly routine';

    const todayName = WEEKDAYS[new Date().getDay()];
    document.getElementById('today-line').textContent = 'Today is ' + todayName;

    const list = document.getElementById('week-list');
    list.innerHTML = '';
    const days = Array.isArray(data.days) ? data.days : [];

    if(days.length === 0){
      list.innerHTML = '<p class="state-msg">No routine found.</p>';
      return;
    }

    days.forEach(function(d){
      const classes = Array.isArray(d.classes) ? d.classes : [];
      const isFree = classes.length === 0;
      const isToday = d.day === todayName;

      const card = document.createElement('div');
      card.className = 'day-card' + (isToday ? ' is-today' : '') + (isFree ? ' is-free' : '');

      let classesHtml = '';
      if(isFree){
        classesHtml = '<div class="no-class">No class</div>';
      } else {
        classesHtml = classes.map(function(c){
          return '<div class="class-pill"><span class="subject">' + (c.subject || 'Class') +
                 '</span><span class="time">' + (c.time || '') + '</span></div>';
        }).join('');
      }

      card.innerHTML =
        '<div class="day-label">' +
          '<div class="day-name">' + d.day + '</div>' +
          (isToday ? '<span class="today-tag">Today</span>' : '') +
        '</div>' +
        '<div class="day-classes">' + classesHtml + '</div>';

      list.appendChild(card);
    });
  }

  fetch('data.json')
    .then(function(res){
      if(!res.ok) throw new Error('Could not load data.json');
      return res.json();
    })
    .then(render)
    .catch(function(err){
      document.getElementById('week-list').innerHTML =
        '<p class="state-msg">Could not load the routine (' + err.message + ').</p>';
    });
</script>
</body>
</html>
